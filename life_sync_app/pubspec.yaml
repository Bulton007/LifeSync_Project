name: life_sync_app
description: "LifeSync - Your personal life management companion."

publish_to: 'none'

version: 1.0.0+20260905

environment:
  sdk: ^3.12.1

# ============================================================
# DEPENDENCIES
# ============================================================

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  get: ^4.7.3
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  sqflite: ^2.4.2
  flutter_svg: ^2.3.0
  lottie: ^3.5.1


# ============================================================
# DEVELOPMENT DEPENDENCIES
# ============================================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


# ============================================================
# FLUTTER
# ============================================================

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/Life-Sync SVG File/Icons/
    - assets/Life-Sync SVG File/Icons/BottomBar/
    - assets/Life-Sync SVG File/Icons/FinancialTab/
    - assets/Life-Sync SVG File/Images/
    - lib/Life-Sync SVG File/Icons/
    - lib/Life-Sync SVG File/Icons/BottomBar/
    - lib/Life-Sync SVG File/Icons/FinancialTab/
    - lib/Life-Sync SVG File/Images/


# ============================================================
# APP ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/app_logo.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

  remove_alpha_ios: true
