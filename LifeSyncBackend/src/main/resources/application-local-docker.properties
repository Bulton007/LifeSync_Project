spring.config.import=
spring.datasource.url=jdbc:postgresql://postgres:5432/lifesync
spring.datasource.username=lifesync
spring.datasource.password=local-testing-only
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.liquibase.enabled=false
spring.sql.init.mode=never
spring.data.redis.host=redis
spring.data.redis.port=6379
server.port=8085
server.tomcat.basedir=/tmp/lifesync-tomcat
logging.file.name=/tmp/lifesync/app.log
app.profile-images.directory=/data/profile-images
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
