spring.application.name=LifeSyncBackend

################################################
# PostgreSQL
################################################

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

################################################
# Hibernate
################################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

################################################
# Flyway
################################################

spring.flyway.enabled=false

################################################
# Server
################################################

server.port=8085
server.tomcat.basedir=./tomcat-temp
app.profile-images.directory=./uploads/profile-images

################################################
# JWT
################################################

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

################################################
# Mail
################################################

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

################################################
# Telegram Bot
################################################
telegram.bot.token=${LIFESYNC_TELEGRAM_BOT_TOKEN:}
telegram.bot.api-url=https://api.telegram.org/bot${telegram.bot.token}
