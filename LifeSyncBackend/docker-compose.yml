version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lifesync
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d lifesync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.openshift
    ports: ["8085:8085"]
    environment:
      - SPRING_PROFILES_ACTIVE=openshift
      - DB_URL=jdbc:postgresql://postgres:5432/lifesync
      - DB_USERNAME=admin
      - DB_PASSWORD=password123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=YourSuperSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm123456789
      - JWT_EXPIRATION_MS=86400000
      - SERVER_TOMCAT_BASEDIR=/tmp/tomcat
      - LOGGING_FILE_NAME=/tmp/logs/app.log
      - UPLOAD_DIR=/tmp/uploads/profile-images
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: